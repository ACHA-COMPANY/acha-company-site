[build]
  command = "python3 build.py"
  publish = "public"

# Adresses sans .html : /studio sert studio.html (Netlify le fait par défaut avec « Pretty URLs »).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
